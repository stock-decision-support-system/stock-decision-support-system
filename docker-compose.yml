version: '3'
services:
  backend:
    build:
      context: ./backend
    container_name: django_backend
    ports:
      - "8000:8000"  # 讓 backend 暴露到 8000 端口
    volumes:
      - ./backend:/app
      - ./my-project-8423-1685343098922-1fed5b68860e.json:/home/case/stock-decision-support-system/my-project-8423-1685343098922-1fed5b68860e.json
    env_file:
      - ./backend/.env
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
    container_name: react_frontend
    ports:
      - "3000:3000"  # 暴露前端的 3000 端口
    volumes:
      - ./frontend:/app
    stdin_open: true
    tty: true

  nginx:
    image: nginx:latest
    container_name: nginx_reverse_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # 這裡加載我們的自定義 Nginx 配置
      - ./ssl/server-cert.pem:/etc/ssl/certs/server-cert.pem
      - ./ssl/server-key.pem:/etc/ssl/private/server-key.pem
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - frontend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge